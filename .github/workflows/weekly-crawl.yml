name: Weekly crawl

on:
  schedule:
    # Mondays at 14:17 UTC (9:17 a.m. Eastern in winter, 10:17 a.m. in summer).
    # An off-the-hour minute avoids GitHub's busiest scheduling slots.
    - cron: "17 14 * * 1"
  workflow_dispatch: # also allow "Run workflow" by hand from the Actions tab

permissions:
  contents: write # needed to commit the updated history back to the repo

concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen --python 3.12

      - name: Run tests
        run: uv run pytest -q

      - name: Crawl the 12 Senate subcommittee pages
        run: uv run approps-deadlines

      - name: Show the report on the run's summary page
        if: always()
        run: cat data/reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the new history and tracker CSV
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Weekly crawl $(date -u +%Y-%m-%d)"
            git push
          fi
